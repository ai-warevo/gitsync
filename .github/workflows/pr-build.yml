# Pull request CI — lint, build, and test using the shared C++23 matrix.
name: PR Build

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ai-warevo/.github/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: false
      lint_cmd: make lint
      build_cmd: make build
      test_cmd: make test
