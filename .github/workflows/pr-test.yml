# PR Test - fast unit tests on every pull request
#
# Triggers: pull_request to main/master
# Calls: reusable-matrix.yml from ai-warevo/.github
#
# This workflow runs Debug unit tests across all Linux toolchains (gcc-15, clang-18-libstdc, clang-18-libcxx),
# keeping feedback time to <15 minutes with parallel builds.

name: PR Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ai-warevo/.github/.github/workflows/reusable-matrix.yml@main
    with:
      source_dir: .
      build_dir: build
      build_types: '["Debug"]'
      enable_windows: false
      cmake_extra_args_linux: >-
        -DGITSYNC_BUILD_TESTS=ON
        -DGITSYNC_WARNINGS_AS_ERRORS=ON
      ctest_timeout: 120
