# Weekly deep CI — sanitizer matrix and coverage report.
name: Weekly Deep

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sanitizers:
    uses: ai-warevo/.github/.github/workflows/reusable__common__sanitizers_cpp23.yml@main
    with:
      build_cmd: make build
      test_cmd: make test
      working_directory: .

  coverage:
    uses: ai-warevo/.github/.github/workflows/reusable__common__coverage_cpp23.yml@main
    with:
      coverage_cmd: make coverage
      min_coverage: 0
      deploy_pages: false
      deploy_badge: false
      working_directory: .
      coverage_artifacts_path: |
        coverage.xml
        htmlcov/
      coverage_xml_path: coverage.xml
      coverage_html_path: htmlcov
