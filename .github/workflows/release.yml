# Release — build binaries, then publish via reusable workflow

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); leave empty for auto'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  # Get resolved version from reusable workflow
  resolve:
    name: Resolve version
    uses: ai-warevo/.github/.github/workflows/reusable-release-with-build.yml@main
    with:
      version: ${{ inputs.version || '' }}
      artifact_name: gitsync-release
      artifact_directory: artifacts
    permissions:
      contents: write

  # Build with resolved version
  build:
    name: Build ${{ matrix.os-label }} binary
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os-label: Linux
            runs-on: ubuntu-latest
            container: ghcr.io/ai-warevo/ci-cpp23
            build-dir: build/release
            artifact-path: build/release/gitsync
            artifact-name: gitsync-linux
            post-build: strip build/release/gitsync
            setup-env: false
            sign: false
          - os-label: Windows
            runs-on: windows-latest
            container: null
            build-dir: build/msvc
            artifact-path: build/msvc/Release/gitsync.exe
            artifact-name: gitsync-windows
            post-build: ''
            setup-env: true
            sign: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Update VERSION file
        run: echo "${{ needs.resolve.outputs.release_version_stripped }}" > VERSION
        shell: bash

      - name: Setup MSVC environment
        if: ${{ matrix.setup-env }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Import code signing certificate
        if: ${{ matrix.sign }}
        uses: ai-warevo/.github/.github/actions/windows-code-sign@main
        with:
          certificate_secret: ${{ secrets.SIGNING_CERTIFICATE }}
          certificate_password: ${{ secrets.CERTIFICATE_PASSWORD }}

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: ${{ matrix.build-dir }}
          build_type: Release
          config: ${{ matrix.os-label == 'Windows' && 'Release' || '' }}
          extra_args: -DGITSYNC_BUILD_TESTS=OFF -DGITSYNC_WARNINGS_AS_ERRORS=ON

      - name: Post-build (strip binary)
        if: ${{ matrix.post-build != '' }}
        run: ${{ matrix.post-build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # Collect artifacts
  collect-artifacts:
    name: Collect release artifacts
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-linux
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gitsync-windows
          path: artifacts

      - name: Upload final artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitsync-release
          path: artifacts/
          if-no-files-found: error

  # Publish via reusable workflow (which also does commit/tag)
  publish:
    name: Publish release
    needs: [resolve, collect-artifacts]
    uses: ai-warevo/.github/.github/workflows/reusable-release-with-build.yml@main
    with:
      version: ${{ needs.resolve.outputs.release_version_stripped }}
      artifact_name: gitsync-release
      artifact_directory: artifacts
    permissions:
      contents: write
