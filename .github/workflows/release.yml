# Release — shared version resolution, C++23 build matrix, and publication.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); leave empty for automatic resolution'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  resolve_version:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.version.outputs.release_notes }}
    steps:
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'release_notes=Manual release of gitsync %s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  resolve_from_catalog:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.version != '') }}
    uses: ai-warevo/.github/.github/workflows/reusable__release__resolve_version.yml@main
    with:
      version_source: version_file
      version_file_path: VERSION

  build:
    needs: [resolve_version, resolve_from_catalog]
    if: ${{ always() && (needs.resolve_version.result == 'success' || needs.resolve_from_catalog.result == 'success') }}
    uses: ai-warevo/.github/.github/workflows/reusable__common__build_cpp23.yml@main
    with:
      upload_artifacts: true
      artifacts_base_path: dist
      new_version_number: ${{ needs.resolve_version.outputs.version || needs.resolve_from_catalog.outputs.version }}
      lint_cmd: make lint
      build_cmd: make build
      test_cmd: make test
      version_file_path: VERSION
      enable_code_signing: true
      code_sign_presets: msvc-release
    secrets:
      code_sign_certificate_base64: ${{ secrets.SIGNING_CERTIFICATE }}
      code_sign_certificate_password: ${{ secrets.CERTIFICATE_PASSWORD }}

  publish:
    needs: [resolve_version, resolve_from_catalog, build]
    if: ${{ always() && needs.build.result == 'success' && (needs.resolve_version.result == 'success' || needs.resolve_from_catalog.result == 'success') }}
    uses: ai-warevo/.github/.github/workflows/reusable__release__publish.yml@main
    with:
      version: ${{ needs.resolve_version.outputs.version || needs.resolve_from_catalog.outputs.version }}
      release_notes: ${{ needs.resolve_version.outputs.release_notes || needs.resolve_from_catalog.outputs.release_notes }}
      release_notes_footer: |
        ### 📦 What's Included
        - Linux and Windows gitsync binaries
        - Cross-platform Git repository synchronization
        - Multi-layer configuration and SSH known_hosts management
        - Template-based branch naming

        ### 🚀 Quick Start
        Download the binary for your platform and create `~/.gitsync/config.json`.
        See the [gitsync README](https://github.com/ai-warevo/gitsync#readme) for configuration options.
